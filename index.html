<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Advocate Didi! ⚖️🎉</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-light: #a78bfa;
      --secondary: #ec4899;
      --accent: #f59e0b;
      --gold: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #31103f 50%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.18);
      --text-color: #f8fafc;
      --court-gold: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    .legal-floating-icons {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .float-item {
      position: absolute;
      opacity: 0.15;
      animation: floatUp 12s infinite linear;
      font-size: 2rem;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
      20% { opacity: 0.2; }
      80% { opacity: 0.2; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .audio-control {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .audio-control:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.25);
    }

    .music-waves {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
    }

    .wave-bar {
      width: 3px;
      height: 100%;
      background: #ec4899;
      border-radius: 2px;
      animation: wave 1s infinite ease-in-out alternate;
    }

    .wave-bar:nth-child(2) { animation-delay: 0.2s; height: 70%; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; height: 40%; }

    @keyframes wave {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    .audio-control.paused .wave-bar {
      animation: none;
      height: 3px;
    }

    .deck-container {
      width: 90%;
      max-width: 850px;
      min-height: 520px;
      position: relative;
      z-index: 10;
      margin: 20px auto;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transform: scale(0.9) translateY(30px);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1) translateY(0);
    }

    .legal-badge {
      background: rgba(251, 191, 36, 0.2);
      border: 1px solid var(--court-gold);
      color: var(--court-gold);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    h1, h2 {
      font-family: 'Playfair Display', serif;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 2.8rem;
      background: linear-gradient(to right, #f472b6, #a78bfa, #fcd34d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    h2 {
      font-size: 2.2rem;
      color: #f3e8ff;
    }

    p.subtitle {
      font-size: 1.1rem;
      color: #cbd5e1;
      line-height: 1.6;
      max-width: 650px;
      margin-bottom: 25px;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 12px 28px;
      border-radius: 50px;
      border: none;
      font-size: 1rem;
