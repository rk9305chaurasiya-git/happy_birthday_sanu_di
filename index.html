<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Advocate Didi! ⚖️🎉</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-light: #a78bfa;
      --secondary: #ec4899;
      --accent: #f59e0b;
      --gold: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #31103f 50%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.18);
      --text-color: #f8fafc;
      --court-gold: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    .legal-floating-icons {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .float-item {
      position: absolute;
      opacity: 0.15;
      animation: floatUp 12s infinite linear;
      font-size: 2rem;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
      20% { opacity: 0.2; }
      80% { opacity: 0.2; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .audio-control {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .audio-control:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.25);
    }

    .music-waves {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
    }

    .wave-bar {
      width: 3px;
      height: 100%;
      background: #ec4899;
      border-radius: 2px;
      animation: wave 1s infinite ease-in-out alternate;
    }

    .wave-bar:nth-child(2) { animation-delay: 0.2s; height: 70%; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; height: 40%; }

    @keyframes wave {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    .audio-control.paused .wave-bar {
      animation: none;
      height: 3px;
    }

    .deck-container {
      width: 90%;
      max-width: 850px;
      min-height: 520px;
      position: relative;
      z-index: 10;
      margin: 20px auto;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transform: scale(0.9) translateY(30px);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1) translateY(0);
    }

    .legal-badge {
      background: rgba(251, 191, 36, 0.2);
      border: 1px solid var(--court-gold);
      color: var(--court-gold);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    h1, h2 {
      font-family: 'Playfair Display', serif;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 2.8rem;
      background: linear-gradient(to right, #f472b6, #a78bfa, #fcd34d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    h2 {
      font-size: 2.2rem;
      color: #f3e8ff;
    }

    p.subtitle {
      font-size: 1.1rem;
      color: #cbd5e1;
      line-height: 1.6;
      max-width: 650px;
      margin-bottom: 25px;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 12px 28px;
      border-radius: 50px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .court-container {
      width: 100%;
      height: 180px;
      position: relative;
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #btn-no {
      position: absolute;
      transition: all 0.15s ease;
      background: #ef4444;
      color: white;
      z-index: 20;
    }

    #btn-yes {
      background: #22c55e;
      color: white;
      font-size: 1.2rem;
      padding: 14px 36px;
      z-index: 10;
    }

    .verdict-box {
      margin-top: 15px;
      padding: 12px 20px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      border-radius: 12px;
      color: #86efac;
      font-weight: 600;
      display: none;
    }

    .scheduler-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      width: 100%;
      margin: 20px 0;
    }

    .option-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .option-card:hover, .option-card.selected {
      border-color: var(--secondary);
      background: rgba(236, 72, 153, 0.15);
      transform: translateY(-4px);
    }

    .option-card span {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 8px;
    }

    .date-picker-input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      padding: 10px 15px;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      margin-top: 10px;
      width: 100%;
      max-width: 250px;
      color-scheme: dark;
    }

    .photo-frame {
      background: #ffffff;
      padding: 12px 12px 35px 12px;
      border-radius: 8px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      transform: rotate(-2deg);
      transition: transform 0.3s ease;
      max-width: 380px;
      width: 100%;
      margin: 0 auto;
    }

    .photo-frame:hover {
      transform: rotate(0deg) scale(1.03);
    }

    .photo-frame img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      object-position: center 15%;
      border-radius: 4px;
    }

    .photo-caption {
      color: #1e293b;
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      margin-top: 10px;
      font-weight: bold;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 15px;
      z-index: 10;
    }

    .dots-container {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: var(--secondary);
      width: 28px;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      .deck-container { min-height: 580px; }
      .slide { padding: 25px 18px; }
      h1 { font-size: 2.1rem; }
      h2 { font-size: 1.7rem; }
      .photo-frame img { height: 200px; }
    }
  </style>
</head>
<body>

  <div id="confetti-canvas"></div>

  <div class="legal-floating-icons" id="floating-icons"></div>

  <div class="audio-control paused" id="music-btn" title="Toggle Happy Birthday Music">
    <span>🎵</span>
    <div class="music-waves">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <span id="music-text" style="font-size: 0.85rem; font-weight: 600;">Play Music</span>
  </div>

  <div class="deck-container">
    
    <div class="slide active" id="slide-1">
      <div class="legal-badge">⚖️ Supreme Court of Siblings</div>
      <h1>Order in the Court! 🔨</h1>
      <p class="subtitle">The Honorable Advocate Sanu Didi is requested to preside over today's special session. A very important verdict needs to be delivered
